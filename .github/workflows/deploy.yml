# Publishes the app to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The log book is committed encrypted (`npm run lock`: data/lock.json + data/projects/*/.enc files,
# one password per project) and published as it is; the site asks for a project password before
# showing anything. If the repo holds a plain data/logbook.json instead, the deploy encrypts it with
# the LOGBOOK_PASSWORD repository secret (one password for every project), and refuses to publish
# when neither is there. Set LOGBOOK_PUBLISH_DATA to 'false' below to
# publish an empty app instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the log book will be published encrypted
        run: |
          if [ ! -f data/lock.json ] && [ -z "$LOGBOOK_PASSWORD" ]; then
            echo "::error::Run 'npm run lock' and commit data/, or add a LOGBOOK_PASSWORD repository secret."
            exit 1
          fi
        env:
          LOGBOOK_PASSWORD: ${{ secrets.LOGBOOK_PASSWORD }}
      - run: npm run build
        env:
          LOGBOOK_PUBLISH_DATA: 'true'
          LOGBOOK_PASSWORD: ${{ secrets.LOGBOOK_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
