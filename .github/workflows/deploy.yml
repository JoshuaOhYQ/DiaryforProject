# Publishes the app to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The committed data/logbook.json is published with the site, encrypted with the admin password
# in the LOGBOOK_PASSWORD secret (Settings → Secrets and variables → Actions → New repository secret).
# The site asks for that password before showing anything. Set LOGBOOK_PUBLISH_DATA to 'false'
# below to publish an empty app instead.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the admin password is set
        run: |
          if [ -z "$LOGBOOK_PASSWORD" ]; then
            echo "::error::Add a LOGBOOK_PASSWORD repository secret so the published log book is password-protected."
            exit 1
          fi
        env:
          LOGBOOK_PASSWORD: ${{ secrets.LOGBOOK_PASSWORD }}
      - run: npm run build
        env:
          LOGBOOK_PUBLISH_DATA: 'true'
          LOGBOOK_PASSWORD: ${{ secrets.LOGBOOK_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
